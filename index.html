<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Apps - Choose Your Version</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 50%, #d1fae5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #454745;
            overflow: hidden;
            position: relative;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(7, 150, 105, 0.1) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .container {
            max-width: 1280px;
            width: 100%;
            padding: 32px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .main-content {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 96px 64px;
            box-shadow: 0 20px 60px rgba(7, 150, 105, 0.15);
            border: 1px solid rgba(7, 150, 105, 0.1);
        }

        h1 {
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #079669 0%, #10b981 50%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
            line-height: 1.1;
            animation: fadeInUp 0.8s ease-out;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 500;
            color: #6b7280;
            margin-bottom: 48px;
            animation: fadeInUp 1s ease-out;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 32px;
            animation: fadeInUp 0.6s ease-out;
        }

        .version-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeInUp 1.2s ease-out;
        }

        .version-btn {
            display: block;
            background: white;
            border: 2px solid #10b981;
            border-radius: 16px;
            padding: 24px 32px;
            text-decoration: none;
            color: #1f2937;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(7, 150, 105, 0.1);
        }

        .version-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(7, 150, 105, 0.2);
            border-color: #059669;
            background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
        }

        .version-btn-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #079669;
            margin-bottom: 8px;
        }

        .version-btn-desc {
            font-size: 1rem;
            color: #6b7280;
            font-weight: 500;
        }

        .version-btn-url {
            font-size: 0.875rem;
            color: #9ca3af;
            margin-top: 8px;
            font-family: 'Courier New', monospace;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* Floating elements for visual interest */
        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(7, 150, 105, 0.1), rgba(169, 203, 187, 0.1));
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            bottom: 15%;
            right: 15%;
            animation-delay: 2s;
        }

        .circle-3 {
            width: 150px;
            height: 150px;
            top: 60%;
            left: 5%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }

            .subtitle {
                font-size: 1.125rem;
            }

            .main-content {
                padding: 48px 32px;
            }

            .floating-circle {
                display: none;
            }

            .logo {
                max-width: 150px;
            }

            .version-btn {
                padding: 20px 24px;
            }

            .version-btn-title {
                font-size: 1.25rem;
            }

            .version-btn-desc {
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body>
    <div class="floating-circle circle-1"></div>
    <div class="floating-circle circle-2"></div>
    <div class="floating-circle circle-3"></div>

    <div class="container">
        <div class="main-content">
            <img src="logo.png" alt="Gate Apps Logo" class="logo">
            <h1>Welcome to Gate Apps</h1>
            <p class="subtitle">Please choose version</p>

            <div class="version-buttons">
                <a href="https://login.gate-apps.com" class="version-btn">
                    <div class="version-btn-title">Version 1</div>
                    <div class="version-btn-desc">Current Production Version</div>
                    <div class="version-btn-url">login.gate-apps.com</div>
                </a>

                <a href="https://app.gate-apps.com/" class="version-btn">
                    <div class="version-btn-title">Version 2025</div>
                    <div class="version-btn-desc">New Version (Tenant Code Required)</div>
                    <div class="version-btn-url">app.gate-apps.com/#tenant#</div>
                </a>

                <a href="https://gate.systemsgarden.com" class="version-btn">
                    <div class="version-btn-title">Legacy Version</div>
                    <div class="version-btn-desc">Systems Garden</div>
                    <div class="version-btn-url">gate.systemsgarden.com</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
