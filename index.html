<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gate Apps - Choose Your Version</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="floating-circle circle-1"></div>
    <div class="floating-circle circle-2"></div>
    <div class="floating-circle circle-3"></div>

    <div class="container">
        <div class="main-content">
            <img src="logo.png" alt="Gate Apps Logo" class="logo">
            <h1>Welcome to Gate Apps</h1>
            <p class="subtitle">Please choose version</p>

            <div class="version-buttons">
                <div class="version-btn version-btn-interactive">
                    <div class="version-btn-title">
                        <span class="version-icon">🚀</span>
                        Version 2025
                    </div>
                    <div class="version-btn-desc">Current Production Version</div>
                    <div class="tenant-input-container">
                        <input type="text" id="tenantInput" class="tenant-input" placeholder="Enter tenant code" required>
                        <button type="button" class="tenant-submit-btn" onclick="redirectToTenant()">Go</button>
                    </div>
                    <div class="version-btn-url">app.gate-apps.com/[tenant]</div>
                </div>

                <a href="https://login.gate-apps.com" class="version-btn">
                    <div class="version-btn-title">
                        <span class="version-icon">📦</span>
                        Version 2024
                    </div>
                    <div class="version-btn-desc">Previous Version</div>
                    <div class="version-btn-url">login.gate-apps.com</div>
                </a>

                <a href="https://gate.systemsgarden.com" class="version-btn">
                    <div class="version-btn-title">
                        <span class="version-icon">🏛️</span>
                        Legacy Version
                    </div>
                    <div class="version-btn-desc">Systems Garden</div>
                    <div class="version-btn-url">gate.systemsgarden.com</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        function redirectToTenant() {
            const tenantInput = document.getElementById('tenantInput');
            const tenant = tenantInput.value.trim();

            if (tenant) {
                window.location.href = `https://app.gate-apps.com/${tenant}`;
            } else {
                tenantInput.focus();
                tenantInput.classList.add('input-error');
                setTimeout(() => {
                    tenantInput.classList.remove('input-error');
                }, 500);
            }
        }

        // Allow pressing Enter to submit
        document.getElementById('tenantInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                redirectToTenant();
            }
        });
    </script>
</body>
</html>
